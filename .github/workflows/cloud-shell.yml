name: Validate cloud scripts

on:
  push:
    paths:
      - 'cloud/scripts/**'
      - '.github/workflows/cloud-shell.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          set -e
          for file in cloud/scripts/*.sh; do
            echo "Checking $file"
            bash -n "$file"
          done
